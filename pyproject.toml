[project]
name = "energy-app"
version = "1.0.0"
description = "Application locale de suivi énergétique ORES / Elexys (import Excel, prix spot, agrégation horaire et mensuelle, API et tableau de bord)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Propriétaire" }
authors = [{ name = "Energy App" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "plotly>=5.24",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "playwright>=1.48",
]

[project.scripts]
energy-app = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "alembic/versions", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"] # FastAPI Depends dans les signatures

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "elexys_live: test d'intégration qui contacte réellement le site Elexys (réseau requis)",
]
